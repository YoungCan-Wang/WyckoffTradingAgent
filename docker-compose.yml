# =============================================================================
# Docker Compose - Wyckoff Trading Agent 部署配置
# =============================================================================
#
# 用法：
#   启动所有常驻服务（daemon + dashboard）:  docker compose up -d
#   仅启动 daemon（定时调度）:                  docker compose up -d daemon
#   仅启动 dashboard（可视化面板）:             docker compose up -d dashboard
#   手动进入 TUI:                              docker compose up -d wyckoff && docker exec -it wyckoff-tui bash
#   启动 MCP Server:                          docker compose --profile mcp up -d
#
# 环境变量（可选，用于自定义镜像源）：
#   DOCKER_IMAGE=birdxs/wyckoff-trading-agent:latest
#   或者私有仓库：DOCKER_IMAGE=ghcr.io/your-user/wyckoff-trading-agent:latest
#
# =============================================================================
# 定时任务配置（daemon 容器启动后执行）：
# =============================================================================
#
# 1. 在宿主机项目目录创建 schedules.json 文件（或从容器复制模板）：
#    # 先启动 daemon，它会在宿主机 ./schedules.json 写入默认模板
#    docker compose up -d daemon
#    # 然后编辑该文件
#    nano ./schedules.json
#
#    或者直接创建：
#    cat > ./schedules.json << 'EOF'
#    [
#      {
#        "id": "a-share-funnel",
#        "name": "A股漏斗（每日17:00）",
#        "cron": "0 17 * * 1-5",
#        "action": "运行今天的A股漏斗全量筛选（Step1→Step2→Step3），生成研报并推送飞书",
#        "notify": true,
#        "enabled": true
#      },
#      {
#        "id": "hk-funnel",
#        "name": "港股漏斗（每日18:00）",
#        "cron": "0 18 * * 1-5",
#        "action": "运行今天的港股漏斗全量筛选，生成研报并推送",
#        "notify": true,
#        "enabled": true
#      },
#      {
#        "id": "us-funnel",
#        "name": "美股漏斗（每日22:00）",
#        "cron": "0 22 * * 1-5",
#        "action": "运行今天的美股漏斗全量筛选，生成研报并推送",
#        "notify": true,
#        "enabled": true
#      },
#      {
#        "id": "holding-diagnosis",
#        "name": "持仓诊断（每日16:30）",
#        "cron": "30 16 * * 1-5",
#        "action": "对所有持仓做诊断，检查是否需要调仓或离场，并推送诊断结果",
#        "notify": true,
#        "enabled": true
#      },
#      {
#        "id": "signal-feedback",
#        "name": "信号反馈复盘（每日17:30）",
#        "cron": "30 17 * * 1-5",
#        "action": "对今日发出的信号做复盘反馈，统计信号质量并推送",
#        "notify": true,
#        "enabled": true
#      },
#      {
#        "id": "premarket-risk",
#        "name": "盘前风控（每日09:25）",
#        "cron": "25 9 * * 1-5",
#        "action": "盘前风控检查：评估大盘水温、持仓风险、今日关注要点",
#        "notify": true,
#        "enabled": true
#      }
#    ]
#    EOF
#
# 2. 修改任务后，daemon 每 60 秒自动读取，无需重启。如需立即生效：
#    docker compose restart daemon
#
# 3. 查看任务列表和下次执行时间：
#    docker exec wyckoff-daemon python -m cli schedule-list
#
# 4. 查看 daemon 运行日志：
#    docker logs -f wyckoff-daemon
#
# 5. 手动触发某个任务（立即执行一次）：
#    docker exec wyckoff-daemon python -m cli run "运行今天的A股漏斗全量筛选"
#
# 6. 启用/禁用任务：直接编辑 ./schedules.json，改 enabled 字段后重启 daemon
#    enabled: true  → 任务生效
#    enabled: false → 任务暂停
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 交互式 TUI（手动进入，不随 up -d 自动启动）
  # ---------------------------------------------------------------------------
  wyckoff:
    image: ${DOCKER_IMAGE:-birdxs/wyckoff-trading-agent:latest}
    container_name: wyckoff-tui
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./wyckoff_data:/home/wyckoff/.wyckoff/data
      - ./wyckoff_logs:/home/wyckoff/.wyckoff/logs
      - ./.env:/home/wyckoff/.wyckoff/.env:ro
    networks:
      - wyckoff-network
    # 覆盖 Dockerfile 的 ENTRYPOINT，直接执行 bash 保持容器运行
    entrypoint: ["/bin/bash", "-lc"]
    command: ["while true; do sleep 3600; done"]
    profiles: ["tui"]

  # ---------------------------------------------------------------------------
  # Dashboard 可视化面板
  # ---------------------------------------------------------------------------
  dashboard:
    image: ${DOCKER_IMAGE:-birdxs/wyckoff-trading-agent:latest}
    container_name: wyckoff-dashboard
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./wyckoff_data:/home/wyckoff/.wyckoff/data
      - ./wyckoff_logs:/home/wyckoff/.wyckoff/logs
      - ./.env:/home/wyckoff/.wyckoff/.env:ro
    ports:
      - "8365:8765"
    networks:
      - wyckoff-network
    command: ["dashboard"]
    profiles: ["dashboard"]

  # ---------------------------------------------------------------------------
  # MCP Server 模式（按需启动）
  # ---------------------------------------------------------------------------
  mcp:
    image: ${DOCKER_IMAGE:-birdxs/wyckoff-trading-agent:latest}
    container_name: wyckoff-mcp
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./wyckoff_data:/home/wyckoff/.wyckoff/data
      - ./wyckoff_logs:/home/wyckoff/.wyckoff/logs
      - ./.env:/home/wyckoff/.wyckoff/.env:ro
    networks:
      - wyckoff-network
    command: ["mcp"]
    profiles: ["mcp"]

  # ---------------------------------------------------------------------------
  # Daemon 常驻定时调度进程
  #   - 每 60 秒检查一次任务列表（~/.wyckoff/schedules.json）
  #   - 到时间自动触发 action（作为 Agent 提示词执行）
  #   - 支持 cron 表达式，自动去重（同一分钟不重复触发）
  #   - 任务失败记录 last_error，不影响其他任务
  # ---------------------------------------------------------------------------
  daemon:
    image: ${DOCKER_IMAGE:-birdxs/wyckoff-trading-agent:latest}
    container_name: wyckoff-daemon
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./wyckoff_data:/home/wyckoff/.wyckoff/data
      - ./wyckoff_logs:/home/wyckoff/.wyckoff/logs
      - ./.env:/home/wyckoff/.wyckoff/.env:ro
      # 定时任务配置文件（宿主机编辑 → 容器内自动生效）
      - ./schedules.json:/home/wyckoff/.wyckoff/schedules.json
    networks:
      - wyckoff-network
    command: ["daemon", "--foreground"]

# =============================================================================
# 数据卷（注释掉，改用本地目录挂载）
# =============================================================================
# volumes:
#   wyckoff_data:
#     driver: local
#   wyckoff_logs:
#     driver: local

# =============================================================================
# 网络配置
# =============================================================================
networks:
  wyckoff-network:
    external: true
