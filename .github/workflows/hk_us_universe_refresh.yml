name: Refresh HK US Universe

# 周日 21:30 北京时间（cron `30 13 * * 0`，UTC 13:30）是有意避开工作日的港股/美股漏斗，
# 不是为了排在其他周日任务之后。定时和默认手动触发都在 main 上跑：
# 刷新脚本成功且 data/market_universes/ 有差异时直接提交并推送 main；
# 名单过短时脚本拒绝覆盖（非 0 退出），本工作流不提交、不开分支、不开 PR。没有差异则干净退出。
on:
  schedule:
    - cron: "30 13 * * 0" # 周日 21:30 北京时间，有意避开工作日港股/美股漏斗
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hk-us-universe-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh HK and US universes
        run: python scripts/refresh_hk_us_universe.py

      - name: Commit universe files to main
        run: |
          set -euo pipefail
          git add data/market_universes/hk.txt data/market_universes/us.txt \
            data/market_universes/hk_names.json data/market_universes/us_names.json \
            data/market_universes/hk_meta.json data/market_universes/us_meta.json
          if git diff --staged --quiet; then
            echo "No universe changes"
            exit 0
          fi
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$branch" != "main" ]; then
            echo "Skip commit: universe refresh only pushes from main (current: ${branch})"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh HK and US symbol universes"
          git push origin HEAD:main
