name: Public MCP refactor validation

on:
  push:
    branches: [refactor/public-mcp-boundary]

permissions:
  contents: read

concurrency:
  group: public-mcp-refactor-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/refactor/public-mcp-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Integrate compatibility entrypoints and documentation
        run: python scripts/_apply_public_mcp_refactor.py
      - name: Install project test dependencies
        run: python -m pip install -e '.[dev,mcp]'
      - name: Format and lint only changed Python files
        shell: bash
        run: |
          files=(mcp_server.py cli/__main__.py integrations/public_mcp/*.py tests/test_mcp_server.py tests/test_mcp_write_guard.py tests/test_public_mcp_*.py)
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
      - name: Run focused real SDK and compatibility tests
        shell: bash
        run: |
          python -m pytest tests/test_public_mcp_contracts.py tests/test_public_mcp_stdio.py tests/test_public_mcp_routing.py tests/test_mcp_server.py tests/test_mcp_write_guard.py -q 2>&1 | tee "$RUNNER_TEMP/public-mcp-tests.log"
          python scripts/quality_gate.py --check-functions
      - name: Commit validated integration on the refactor branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/refactor/public-mcp-boundary
          rm scripts/_apply_public_mcp_refactor.py .github/workflows/public-mcp-refactor-check.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp_server.py cli/__main__.py integrations/public_mcp tests/test_mcp_server.py tests/test_mcp_write_guard.py tests/test_public_mcp_*.py README.md GLOSSARY.md docs/ARCHITECTURE.md docs/README_EN.md docs/PUBLIC_MCP.md .github/workflows/ci.yml
          git add -u scripts/_apply_public_mcp_refactor.py .github/workflows/public-mcp-refactor-check.yml
          git commit -m 'refactor(mcp): finalize integration after focused SDK validation'
          git push origin HEAD:refs/heads/refactor/public-mcp-boundary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-mcp-focused-validation
          path: ${{ runner.temp }}/public-mcp-tests.log
          if-no-files-found: ignore
          retention-days: 3
