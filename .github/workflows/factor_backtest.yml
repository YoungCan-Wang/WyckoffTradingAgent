name: Factor Portfolio Backtest

# 与 Backtest Grid / Trigger Calibration 是两条独立的路：那两条跑「形态信号逐笔成交」，
# 这条跑「每隔 K 个交易日按合成价值分重排全市场，持有前 N 只」。因此它不读 snapshot_data
# （那份股票池按拉取当日的存续非 ST 名单构建，每个历史窗口都少约 7.5% 的可交易标的，且漏掉
# 的正是便宜票），而是自建按交易日横切的 PIT 面板。
#
# 取数与回测分两个 job：面板一次约 8000 次 tushare 调用，跑一次就缓存起来，之后调参数不必重拉。

on:
  workflow_dispatch:
    inputs:
      start:
        description: "起始日 YYYY-MM-DD"
        required: true
        default: "2018-01-01"
      end:
        description: "结束日 YYYY-MM-DD"
        required: true
        default: "2026-06-30"
      top_n:
        description: "持仓数网格（逗号分隔）"
        required: true
        default: "20,30,50,100"
      rebalance_days:
        description: "再平衡间隔网格（逗号分隔）"
        required: true
        default: "10,20"
      buffer_mult:
        description: "跌出 top_n×该倍数才卖出"
        required: true
        default: "2.0"
      initial_cash:
        description: "初始资金（元）。一手制下它决定每格预算，直接影响能买到哪些标的"
        required: true
        default: "100000"
      exclude_st:
        description: "是否按 PIT 名称剔除 ST"
        type: boolean
        required: false
        default: true

concurrency:
  group: factor-backtest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  TZ: Asia/Shanghai
  PANEL_DIR: factor_panel
  # Bump this whenever PIT panel input semantics change. Do not restore an
  # older generation: build_panel intentionally skips existing yearly files.
  PANEL_CACHE_VERSION: "v2"

jobs:
  panel:
    name: Build PIT panel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      INPUT_START: ${{ inputs.start }}
      INPUT_END: ${{ inputs.end }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[factor]"

      - name: Restore cached panel
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PANEL_DIR }}
          key: factor-panel-${{ inputs.start }}-${{ inputs.end }}-${{ env.PANEL_CACHE_VERSION }}

      - name: Fetch panel
        run: |
          set -euo pipefail
          # build_panel 按年落盘并跳过已存在的年份，命中缓存时只补最后一段。
          python -u scripts/factor_panel_fetch.py \
            --start "$INPUT_START" \
            --end "$INPUT_END" \
            --output-dir "$PANEL_DIR" \
            --workers 12

      - name: Report panel size
        run: du -sh "$PANEL_DIR" && ls -la "$PANEL_DIR"

      - name: Upload panel
        uses: actions/upload-artifact@v4
        with:
          name: factor-panel
          path: ${{ env.PANEL_DIR }}/*
          retention-days: 5

  backtest:
    name: Sweep portfolio configs
    runs-on: ubuntu-latest
    needs: panel
    timeout-minutes: 120
    env:
      INPUT_START: ${{ inputs.start }}
      INPUT_END: ${{ inputs.end }}
      INPUT_TOP_N: ${{ inputs.top_n }}
      INPUT_REBALANCE_DAYS: ${{ inputs.rebalance_days }}
      INPUT_BUFFER_MULT: ${{ inputs.buffer_mult }}
      INPUT_INITIAL_CASH: ${{ inputs.initial_cash }}
      INPUT_EXCLUDE_ST: ${{ inputs.exclude_st }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[factor]"

      - name: Download panel
        uses: actions/download-artifact@v4
        with:
          name: factor-panel
          path: ${{ env.PANEL_DIR }}

      - name: Prepare logs
        run: mkdir -p logs

      - name: Run sweep
        run: |
          set -euo pipefail
          ST_FLAG=()
          if [ "$INPUT_EXCLUDE_ST" = "true" ]; then ST_FLAG=(--exclude-st); fi
          python -u scripts/factor_backtest.py \
            --panel-dir "$PANEL_DIR" \
            --start "$INPUT_START" \
            --end "$INPUT_END" \
            --top-n "$INPUT_TOP_N" \
            --rebalance-days "$INPUT_REBALANCE_DAYS" \
            --buffer-mult "$INPUT_BUFFER_MULT" \
            --initial-cash "$INPUT_INITIAL_CASH" \
            "${ST_FLAG[@]}" \
            --output-dir analysis/factor_backtest \
            2>&1 | tee logs/factor_backtest.log

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f analysis/factor_backtest/summary.md ]; then
            cat analysis/factor_backtest/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-backtest-results
          path: |
            analysis/factor_backtest/*
            logs/*
          retention-days: 30
