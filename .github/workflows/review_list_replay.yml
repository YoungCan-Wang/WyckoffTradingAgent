name: Review List Replay

on:
  schedule:
    - cron: '25 11 * * 1-5'   # UTC 11:25 Mon-Fri = 北京时间 19:25
  workflow_dispatch:
    inputs:
      allow_full_funnel_fallback:
        description: "快照缺失时显式允许完整重跑前一交易日全市场漏斗"
        required: false
        default: false
        type: boolean

concurrency:
  group: review-list-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      WYCKOFF_WRITE_CONTEXT: "server_job"
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      REVIEW_ALLOW_FULL_FUNNEL_FALLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_full_funnel_fallback && '1' || '0' }}
      REVIEW_REPORT_OUTPUT_DIR: ${{ github.workspace }}/logs
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download matching production funnel trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_date="$(python -u scripts/review_list_replay.py --print-previous-trade-date | tail -n 1)"
          if [[ ! "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "[review] invalid target trade date: ${target_date}; workflow fallback policy will decide"
            exit 0
          fi
          target_file="review_trace_${target_date//-/}.json.gz"
          if ! run_ids="$(gh run list --workflow wyckoff_funnel.yml --branch "$GITHUB_REF_NAME" --status success --limit 12 --json databaseId --jq '.[].databaseId')"; then
            echo "[review] failed to query production funnel runs; workflow fallback policy will decide"
            exit 0
          fi
          for run_id in $run_ids; do
            artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("daily-job-artifacts-"))) | .name' 2>/dev/null | tail -n 1 || true)"
            if [ -z "$artifact_name" ]; then
              continue
            fi
            destination="review-trace-download/${run_id}"
            mkdir -p "$destination"
            if ! gh run download "$run_id" --name "$artifact_name" --dir "$destination"; then
              continue
            fi
            match="$(find "$destination" -type f -name "$target_file" -print -quit)"
            if [ -n "$match" ]; then
              cp "$match" "$GITHUB_WORKSPACE/review_trace_input.json.gz"
              echo "REVIEW_TRACE_PATH=$GITHUB_WORKSPACE/review_trace_input.json.gz" >> "$GITHUB_ENV"
              echo "[review] matched production trace: run=${run_id}, date=${target_date}"
              exit 0
            fi
          done
          echo "[review] no production trace matched date=${target_date}; workflow fallback policy will decide"
          # 最常见的真因是前一交易日那次漏斗失败——失败的 run 不产出 artifact，且上面按
          # --status success 查询也筛不到它，于是复盘以「找不到快照」失败，看不出是上游问题。
          # 把上游状态显式打出来，避免误判成复盘任务自身的故障。
          upstream="$(gh run list --workflow wyckoff_funnel.yml --branch "$GITHUB_REF_NAME" --limit 20 \
            --json databaseId,conclusion,createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"${target_date}\"))] | .[0] | \
                  if . then \"run=\(.databaseId) conclusion=\(.conclusion)\" else \"未找到当日运行\" end" 2>/dev/null || true)"
          echo "[review] 上游 wyckoff_funnel 于 ${target_date} 的状态: ${upstream:-查询失败}"
          echo "[review] 若上游为 failure，本次失败是连带后果；上游恢复后次日自动恢复"

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Run review list replay
        run: |
          set -o pipefail
          python -u scripts/review_list_replay.py \
            2>&1 | tee -a ${{ github.workspace }}/logs/review_list_replay.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-list-replay-logs-${{ github.run_number }}
          path: logs/*
          retention-days: 7
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('FEISHU_WEBHOOK_URL', '')
          if not url:
            print('FEISHU_WEBHOOK_URL 未配置，跳过失败通知')
            exit(0)
          content = '**Run**: ' + os.environ.get('RUN_URL', '') + '\n**Workflow**: ' + os.environ.get('WORKFLOW', '') + '\n**Branch**: ' + os.environ.get('REF', '')
          payload = {
            'msg_type': 'interactive',
            'card': {
              'header': {'title': {'tag': 'plain_text', 'content': '❌ Review List 复盘任务失败'}},
              'elements': [{'tag': 'div', 'text': {'tag': 'lark_md', 'content': content}}]
            }
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
          try:
            urllib.request.urlopen(req, timeout=10)
          except Exception as e:
            print('warning: 失败通知发送异常:', e)
          "
