name: Step4 From Supabase

on:
  workflow_dispatch:
    inputs:
      recommend_date:
        description: "Recommendation date, YYYYMMDD or YYYY-MM-DD. Empty uses latest trade date."
        required: false
        default: ""

concurrency:
  group: step4-oms-a-share-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      WYCKOFF_WRITE_CONTEXT: "server_job"
      TZ: Asia/Shanghai
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      STEP4_LLM_PROVIDER: ${{ vars.STEP4_LLM_PROVIDER || secrets.STEP4_LLM_PROVIDER || 'efficiency' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      EFFICIENCY_API_KEY: ${{ secrets.EFFICIENCY_API_KEY }}
      EFFICIENCY_MODEL: ${{ secrets.EFFICIENCY_MODEL }}
      EFFICIENCY_BASE_URL: ${{ secrets.EFFICIENCY_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      STEP4_BUY_HARD_STOP_ENABLED: "1"
      # 止损 12% -> 5%。生产回测（66 交易日/123 笔/含真实成本）四档单调：
      #   无止损  总收益 -16.49%  夏普 -1.965  回撤 -24.69%  VaR95 -22.14%
      #   -12%    总收益  -5.71%  夏普 -0.794  回撤 -14.51%  VaR95 -12.18%（原实盘值）
      #   -8%     总收益  +0.04%  夏普 -0.068  回撤 -10.22%  VaR95  -9.70%
      #   -5%     总收益  +7.31%  夏普 +0.871  回撤  -7.25%  VaR95  -9.69%
      # 代价是胜率由 46.34% 降到 37.40%——机制是用更多小亏换掉少数巨亏，
      # 收益来自「没有大亏」而非「多赚」，故执行纪律不能中途干预。
      STEP4_BUY_HARD_STOP_PCT: "5.0"
      STEP4_BUY_STOP_MODE: "floor"
      STEP4_PROBE_BUDGET_LIMIT: "0.10"
      STEP4_ATTACK_BUDGET_LIMIT: "0.20"
      STEP4_BUY_BLOCK_REGIMES: UNKNOWN,NEUTRAL,PANIC_REPAIR,RISK_OFF,CRASH,BLACK_SWAN
      # RISK_ON 已从豁免名单移除（移除后自动回落到代码默认禁买集）。
      # 此前依「联动实测 +6.07pct（3/3 为正）」放开，但那只有 3 个样本日。
      # 两次独立的跨周期回测均显示该档为负，且样本在扩大后更差：
      #   2026-08-21 六个月网格：4 笔  胜率 25.0%  均收 -2.96%
      #   2026-08-22 六周期网格：6 笔  胜率 16.7%  均收 -5.03%（中位 -6.81%）
      # 回测生成的交易手册亦明确写「RISK_ON 禁止新仓｜生产市场闸门固定禁止，
      # 不以近期样本收益解禁」。样本仍偏小（6 笔），但两次同向为负、方向与放开依据相反，
      # 且禁买是保守侧，故先恢复禁买。
      STEP4_BUY_ALLOW_REGIMES: BEAR_REBOUND
      STEP4_BLOCK_BUY_SIGNAL_TYPES: ""
      STEP4_REQUIRE_CONFIRMED_BUY_CANDIDATE: "1"
      STEP4_RECOMMEND_DATE: ${{ github.event.inputs.recommend_date }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Run Step4 from Supabase
        run: |
          set -o pipefail
          python -u scripts/step4_from_supabase.py \
            --logs "${{ github.workspace }}/logs/step4_from_supabase.log" \
            2>&1 | tee -a "${{ github.workspace }}/logs/step4_from_supabase.console.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-from-supabase-logs-${{ github.run_number }}
          path: logs/*
          retention-days: 7
          if-no-files-found: warn
