name: Desktop

# 桌面端此前完全没有 CI —— ci.yml 的 paths 里连 desktop/** 都没有。
#
# 而这个应用有一整套**只在 Windows 上执行**的代码：taskkill 回收进程树、
# .venv/Scripts/python.exe 的解释器布局、wyckoff-ipc.exe 的二进制名。开发全在
# macOS 上做，那些分支从来没有真正跑过。所以这里的重点不是「再跑一遍单元测试」，
# 而是**在真的 Windows 机器上打一次包**。
#
# Playwright 会启动真实 Electron 窗口验证渲染外壳；NSIS 安装、Python payload 与
# 退出后的 Python 进程状态仍需在 Windows 安装包上手动冒烟。

on:
  push:
    branches: [main, feature/visible]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main, feature/visible]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试与类型检查在三个平台都跑。
  # 跨平台跑是有意义的：测试里有路径拼接、也有读源码做静态断言的用例，
  # Windows 的 \ 分隔符与 CRLF 都可能让它们表现不同。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build renderer
        run: npm run build:ui

      # Linux 需要虚拟显示；Windows/macOS runner 可直接启动 Electron。
      - name: E2E smoke (Linux 需要虚拟显示)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node test/e2e/smoke.mjs
      - name: E2E smoke
        if: runner.os != 'Linux'
        run: node test/e2e/smoke.mjs

      # 开发态没有打包后的 Python payload；这里只检查 Electron 外壳能完整退出。
      - name: 检查 Electron 残留进程（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Sleep -Seconds 6
          $left = Get-Process -Name electron -ErrorAction SilentlyContinue
          if ($left) {
            Write-Host "退出后仍有 electron 进程残留："
            $left | Format-Table Id, ProcessName
            exit 1
          }
          Write-Host "无残留进程"

  # 真的在 Windows 上打一次包。这是这个 workflow 存在的主要理由。
  package-windows:
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build renderer
        run: npm run build:ui

      # 刻意不跑 build:py（PyInstaller 打 Python 二进制）：那是另一条独立的链，
      # 失败原因也完全不同。这一步要回答的是「electron-builder 能不能在 Windows
      # 上把 Electron 43 打成 NSIS 安装包」。
      # extraResources 指向的 ../dist/python 不存在时 builder 会报错，所以放一个
      # 占位文件 —— 打包结构照样验证得到。
      - name: Stub the Python payload
        shell: bash
        run: |
          mkdir -p ../dist/python/wyckoff-ipc
          echo "placeholder for CI packaging check" > ../dist/python/wyckoff-ipc/wyckoff-ipc.exe

      - name: Package (nsis)
        run: npx --no-install electron-builder --win --publish never

      # 结构自检：安装包和解包目录都要在，且 exe 名字对得上。
      # x64 与 arm64 都要出：Apple Silicon 上的 Windows 虚拟机全是 ARM 版，
      # 只出 x64 的话本地验证只能过 Prism 模拟跑，测不到原生 arm64 的行为。
      - name: Verify artifacts
        shell: bash
        run: |
          set -e
          ls -la dist/
          test -d dist/win-unpacked || { echo "缺 win-unpacked"; exit 1; }
          test -f "dist/win-unpacked/Wyckoff.exe" || { echo "缺 Wyckoff.exe"; exit 1; }
          ls dist/*.exe >/dev/null 2>&1 || { echo "缺 NSIS 安装包"; exit 1; }
          # NSIS 把两个架构合进**同一个**安装包，所以不存在 *arm64*.exe ——
          # 要验 arm64 有没有真的打出来，看解包目录。
          test -f "dist/win-arm64-unpacked/Wyckoff.exe" || { echo "缺 arm64 产物"; exit 1; }
          echo "打包结构检查通过（x64 + arm64）"

      # 上传产物：真正的运行时验证要人在一台 Windows 机器上装一次、点一遍。
      # CI 只能保证「打得出来」。
      - uses: actions/upload-artifact@v7
        with:
          name: wyckoff-windows-installer
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          retention-days: 14
          if-no-files-found: error
