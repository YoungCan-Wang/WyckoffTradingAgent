name: PyPI Patch Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-patch-release
  cancel-in-progress: false

jobs:
  changes:
    name: Detect PyPI package changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2
      - name: Collect merged paths
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/changed-paths.txt"
      - name: Force manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo pyproject.toml > "$RUNNER_TEMP/changed-paths.txt"
      - name: Decide release scope
        id: scope
        shell: bash
        run: |
          cat "$RUNNER_TEMP/changed-paths.txt"
          publish="$(python scripts/release_scope.py pypi "$RUNNER_TEMP/changed-paths.txt")"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$publish" != "true" ]]; then
            echo "No wheel or sdist input changed; PyPI release is skipped."
          fi

  build:
    name: Validate and build patch release
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # checkout v7 起，workflow_run / pull_request_target 触发时**拒绝**签出
      # fork PR 的代码（防「pwn request」：那种触发方式带着写权限和 secrets）。
      # 想放行要显式加 allow-unsafe-pr-checkout: true。
      #
      # 这里不需要放行，而且**绝不该**放行：上面的 if 已经把范围限定在
      # head_branch == 'main'，也就是只签出本仓库主干的提交。这个 job 最终会用
      # Trusted Publishing 发 PyPI —— 让它签出外部 PR 的代码等于把发包权交出去。
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
          # 与 CI / pyproject 显式对齐，避免 [dev] 解析漂移
          python -m pip install "ruff==0.16.2"
      - name: Validate package source
        run: |
          ruff --version
          ruff check .
          ruff format --check .
          python scripts/quality_gate.py --ci
          python -m pytest tests/ -q
      - name: Select next patch version
        id: version
        run: |
          version="$(python scripts/prepare_patch_release.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building PyPI patch release $version"
      - name: Build and inspect distributions
        run: |
          rm -rf build dist *.egg-info
          python -m build
          python -m twine check dist/*
          python -m pip install --no-deps --target /tmp/wyckoff-wheel dist/*.whl
          PYTHONPATH=/tmp/wyckoff-wheel python -c "import importlib.metadata as m; assert m.version('youngcan-wyckoff-analysis') == '${{ steps.version.outputs.version }}'"
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish patch release to PyPI
    needs: build
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/youngcan-wyckoff-analysis/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist-${{ needs.build.outputs.version }}
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
