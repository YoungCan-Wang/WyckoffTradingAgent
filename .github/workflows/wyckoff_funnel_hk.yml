name: Wyckoff Funnel HK

on:
  schedule:
    # 港股常规交易 16:00 HKT 收盘；16:35 HKT / 08:35 UTC 执行，给收盘行情留缓冲。
    - cron: '35 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: tickflow-funnel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      WYCKOFF_WRITE_CONTEXT: "server_job"
      TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET_FUNNEL_WRITE_DB: "1"
      MARKET_FUNNEL_MAX_SYMBOLS: "600"
      MARKET_FUNNEL_QUOTE_BATCH_SIZE: "50"
      MARKET_FUNNEL_QUOTE_BATCH_SLEEP: "1.1"
      MARKET_FUNNEL_KLINE_COUNT: "320"
      MARKET_FUNNEL_KLINE_BATCH_SIZE: "100"
      MARKET_FUNNEL_KLINE_BATCH_SLEEP: "2.1"
      MARKET_FUNNEL_MIN_QUOTE_AMOUNT: "8000000"
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Prepare logs dir
        run: mkdir -p logs

      - name: Run HK funnel
        run: |
          set -o pipefail
          python -u scripts/market_funnel_job.py \
            --market hk \
            --output "${{ github.workspace }}/logs/hk_funnel_result.json" \
            2>&1 | tee -a "${{ github.workspace }}/logs/hk_funnel.console.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hk-funnel-logs-${{ github.run_number }}
          path: logs/*
          retention-days: 7
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.environ.get('FEISHU_WEBHOOK_URL', '')
          if not url:
            print('FEISHU_WEBHOOK_URL 未配置，跳过失败通知')
            exit(0)
          content = '**Run**: ' + os.environ.get('RUN_URL', '') + '\n**Workflow**: ' + os.environ.get('WORKFLOW', '') + '\n**Branch**: ' + os.environ.get('REF', '')
          payload = {
            'msg_type': 'interactive',
            'card': {
              'header': {'title': {'tag': 'plain_text', 'content': '❌ 港股漏斗任务失败'}},
              'elements': [{'tag': 'div', 'text': {'tag': 'lark_md', 'content': content}}]
            }
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'})
          try:
            urllib.request.urlopen(req, timeout=10)
          except Exception as e:
            print('warning: 失败通知发送异常:', e)
          "
