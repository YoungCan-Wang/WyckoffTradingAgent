name: Fibonacci Reliability 441
on:
  push:
    branches: [research/fib-reliability-441-20260920]
    paths:
      - .github/workflows/fib_reliability_441.yml
  workflow_dispatch:
concurrency:
  group: fib-reliability-441-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  historical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect date-based historical data
        run: python scripts/fib_audit/collect.py --start 20200901 --end 20260918
      - name: Upload immutable data snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fib-audit-market-snapshot
          path: artifacts/fib-audit-data
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Upload research source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fib-audit-source
          path: |
            scripts/fib_audit
            core/trade_friction.py
            core/cash_portfolio.py
            core/market_trade_cost.py
            pyproject.toml
            uv.lock
            AGENTS.md
          if-no-files-found: error
          retention-days: 90
