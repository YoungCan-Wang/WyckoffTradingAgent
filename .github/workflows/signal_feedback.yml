name: Signal Feedback

on:
  schedule:
    # 北京时间周一到周四 23:30，GitHub Actions 使用 UTC；只刷新信号反馈。
    - cron: "30 15 * * 1-4"
    # 北京时间周五 23:30，额外跑周度策略反思。
    # 「今天是不是周五」必须由哪条 cron 触发来决定，不能在步骤里读 date -u：GitHub 的
    # 排队延迟经常把 run 推后几小时，实测周四那班被推到 08-28T00:29Z（UTC 已跨到周五）
    # 于是误跑了一次周度反思，周五那班被推到 08-29T00:02Z（UTC 已跨到周六）于是整周静默
    # 跳过。触发时刻记下的 cron 表达式不受延迟影响。
    - cron: "30 15 * * 5"
  workflow_dispatch:
    inputs:
      formal_dynamic_approved:
        description: "人工批准本轮策略归因进入正式 dynamic（仍需归因/回测/治理清单通过）"
        required: false
        default: false
        type: boolean
      formal_dynamic_approval_reason:
        description: "批准原因；勾选 formal_dynamic_approved 时必填"
        required: false
        default: ""
        type: string

concurrency:
  group: signal-feedback-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      WYCKOFF_WRITE_CONTEXT: "server_job"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      SIGNAL_REGISTRY_HORIZON: "5"
      WYCKOFF_STRATEGY_REFLECTION: ${{ vars.WYCKOFF_STRATEGY_REFLECTION || 'shadow' }}
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh signal feedback
        run: python -u scripts/signal_feedback_job.py

      - name: Decide whether to run weekly strategy reflection
        id: reflection_policy
        env:
          # github.event.schedule 是「触发这次 run 的那条 cron 表达式」，在排队时刻就定下来了，
          # 后面延迟多久都不会变。原先这里读 date -u +%u，等于把周几绑在队列延迟上。
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${TRIGGER_CRON}" = "30 15 * * 5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest backtest confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! run_id="$(gh run list --workflow backtest_grid.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"; then
            echo "[attribution] failed to query Backtest Grid runs; continue without confirmation"
            exit 0
          fi
          if [ -z "$run_id" ]; then
            echo "[attribution] no successful Backtest Grid run found; continue without confirmation"
            exit 0
          fi
          if ! artifact_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("backtest-market-report-"))) | .name' | tail -n 1)"; then
            echo "[attribution] failed to query Backtest Grid artifacts; continue without confirmation"
            exit 0
          fi
          if [ -z "$artifact_name" ]; then
            echo "[attribution] no backtest confirmation artifact in run ${run_id}; continue without confirmation"
            exit 0
          fi
          mkdir -p backtest-confirmation
          if gh run download "$run_id" --name "$artifact_name" --dir backtest-confirmation; then
            if [ -s backtest-confirmation/backtest_confirmation.json ]; then
              cp backtest-confirmation/backtest_confirmation.json backtest_confirmation.json
              echo "[attribution] using backtest confirmation from run ${run_id} (${artifact_name})"
            else
              echo "[attribution] artifact has no backtest_confirmation.json; continue without confirmation"
            fi
          else
            echo "[attribution] failed to download backtest confirmation; continue without confirmation"
          fi

      - name: Build formal dynamic approval
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_dynamic_approved }}
        env:
          APPROVAL_REASON: ${{ inputs.formal_dynamic_approval_reason }}
        run: |
          set -euo pipefail
          if [ -z "${APPROVAL_REASON}" ]; then
            echo "::error::formal_dynamic_approval_reason is required when formal_dynamic_approved=true"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime

          payload = {
              "approved": True,
              "approved_by": os.environ.get("GITHUB_ACTOR", ""),
              "reason": os.environ["APPROVAL_REASON"],
              "approved_at": datetime.now(UTC).isoformat(),
              "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }
          with open("formal_dynamic_approval.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          PY

      - name: Build strategy attribution report
        run: |
          args=(--market cn --days 60 --horizons 1,3,5,10,20)
          if [ -s backtest_confirmation.json ]; then
            args+=(--backtest-confirmation-json backtest_confirmation.json)
          fi
          if [ -s formal_dynamic_approval.json ]; then
            args+=(--formal-dynamic-approval-json formal_dynamic_approval.json)
          fi
          python -u scripts/strategy_attribution_report.py "${args[@]}"

      - name: Refresh weekly strategy reflection
        if: steps.reflection_policy.outputs.run == 'true'
        run: python -u scripts/strategy_reflection_job.py
